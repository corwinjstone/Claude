name: Update Big Money Tracker

on:
  schedule:
    # Every 30 minutes, 6am-9pm US Eastern on weekdays (EDGAR accepts filings 6am-10pm ET).
    - cron: '7,37 10-23 * * 1-5'
    - cron: '7,37 0-2 * * 2-6'
  push:
    branches: [main]
    paths:
      - 'big-money/**'
      - '.github/workflows/big-money-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: big-money-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run parser tests
        working-directory: big-money
        run: npm test

      - name: Restore previous data from gh-pages
        run: |
          git fetch --depth=1 origin gh-pages || exit 0
          git show FETCH_HEAD:big-money/data.json > big-money/site/data.json || rm -f big-money/site/data.json

      - name: Fetch new events
        working-directory: big-money
        run: node fetch.mjs
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          UW_API_TOKEN: ${{ secrets.UW_API_TOKEN }}

      - name: Deploy to gh-pages/big-money
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./big-money/site
          destination_dir: big-money
          keep_files: true
          commit_message: 'Update Big Money Tracker data'
